name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk KacaLauncher-${{ github.run_number }}.apk
          cp iconpack/build/outputs/apk/debug/iconpack-debug.apk KacaIcons-${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KacaLauncher-${{ github.run_number }}
          path: |
            KacaLauncher-*.apk
            KacaIcons-*.apk

      - name: Publish release (download langsung dari HP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kaca Launcher build ${{ github.run_number }}
          files: |
            KacaLauncher-*.apk
            KacaIcons-*.apk
          make_latest: true
